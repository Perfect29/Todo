version: '3'

services:
  redis:
    image: redis
    container_name: todoredis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
  db:
    image: postgres
    container_name: tododb
    environment:
      POSTGRES_PASSWORD: pass
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres-data:/var/lib/postgresql/data

  app:
    build: .
    ports:
      - "1323:1323"
    depends_on:
      - db
      - redis
    environment:
      DATABASE_URL: postgres://postgres:pass@db:5432/postgres?sslmode=disable
      REDIS_ADDR: redis:6379

volumes:
  postgres-data: